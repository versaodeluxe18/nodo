<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NÓ-DO</title>
    <style>
        :root {
            --layout-accent: #0e639c;
            --intro-duration: 4200ms;
            --mobile-breakpoint: 768px;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ccc;
            overflow: hidden; /* Impede qualquer tipo de scroll lateral ou vertical indesejado */
            width: 100vw;
            height: 100vh;
            position: fixed; /* Evita que o mobile tente "rolar" ao tocar em elementos */
        }

        body.intro-active #toolbar,
        body.intro-active .instruction,
        body.intro-active #code-panel,
        body.intro-active #openMenu {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Barra de Ferramentas Superior */
        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: calc(100vw - 20px);
            background: #252526;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1;
        }

        button .button-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        button .button-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button .button-label {
            display: inline-flex;
            align-items: center;
        }

        button.icon-only {
            padding: 8px;
            min-width: 32px;
        }

        button:hover { background: #1177bb; }

        button.secondary { background: #3c3c3c; }
        button.secondary:hover { background: #4c4c4c; }

        button.success { background: #3c3c3c; }
        button.success:hover { background: #4c4c4c; }

        button.warning { background: #3c3c3c; color: #fff; }
        button.warning:hover { background: #4c4c4c; }

        /* Separador visual na toolbar */
        .separator {
            width: 1px;
            height: 25px;
            background: #555;
            margin: 0 5px;
        }

        /* O Canvas Principal */
        canvas {
            display: block;
            cursor: grab;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }

        /* Painel Lateral de Código */
        #code-panel {
    position: fixed; /* Mude de absolute para fixed para garantir que ele prenda na tela */
    top: 0;
    right: -50%; /* Mantém o painel fora da tela antes de abrir */
    width: 35%; /* Mantém o painel com menos da metade da largura da tela */
    max-width: 500px; /* Limite no desktop */
    height: 100vh;
    background: #252526;
    border-left: 1px solid #333;
    transition: all 0.3s ease-in-out;
    display: flex;
    flex-direction: column;
    z-index: 1000; /* Garanta que fique acima de tudo */
    visibility: hidden; /* Oculta totalmente para o navegador mobile */
}


#code-panel.active {
    right: 0;
    visibility: visible;
}

        .panel-header {
            padding: 15px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e1e1e;
        }

        .panel-header h3 { margin: 0; color: #fff; font-size: 16px; }

        #code-editor {
            flex: 1;
            background: #1e1e1e;

            padding: 15px;

        }

        .instruction {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-width: calc(100vw - 20px);
            color: #666;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }


#file-type {
    background: #1e1e1e;
    color: #d4d4d4;
    border: 1px solid #3c3c3c;
    padding: 6px 8px;
    margin: 10px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 13px;
    outline: none;
}

#file-type option {
    background: #1e1e1e;
    color: #d4d4d4;
}

#intro-overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at center, rgba(30, 30, 30, 0.9) 0%, #1e1e1e 70%);
    z-index: 999;
    pointer-events: none;
}

.intro-wordmark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.35rem, 1vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--layout-accent);
    text-transform: uppercase;
    text-shadow: 0 0 24px rgba(14, 99, 156, 0.35);
    opacity: 0;
    animation: introWordmarkInOut var(--intro-duration) ease forwards;
}

.intro-group {
    display: grid;
    grid-template-columns: auto auto auto;
    align-items: center;
    justify-items: center;
    column-gap: clamp(0.25rem, 0.8vw, 0.75rem);
    min-width: clamp(11rem, 19vw, 15rem);
}

.intro-bracket,
.intro-word,
.intro-tilde {
    line-height: 1;
}

.intro-bracket {
    font-size: clamp(5rem, 11vw, 9rem);
    animation-duration: var(--intro-duration);
    animation-fill-mode: forwards;
    animation-timing-function: ease-in-out;
}

.intro-bracket.left {
    animation-name: revealBracketLeft;
}

.intro-bracket.right {
    animation-name: revealBracketRight;
}

.intro-word {
    font-size: clamp(2.5rem, 6vw, 5rem);
    white-space: nowrap;
    opacity: 0;
    transform: scale(0.82);
    animation: revealWord var(--intro-duration) ease forwards;
}

.intro-tilde {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: clamp(2rem, 4vw, 3.5rem);
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    opacity: 0;
    transform: scale(0.6);
    animation: revealTilde var(--intro-duration) ease forwards;
}

@keyframes introWordmarkInOut {
    0% {
        opacity: 0;
        transform: scale(0.72);
    }
    14% {
        opacity: 1;
        transform: scale(1);
    }
    84% {
        opacity: 1;
        transform: scale(1);
    }
    100% {
        opacity: 0;
        transform: scale(1.02);
    }
}

@keyframes revealBracketLeft {
    0%, 16% {
        transform: translateX(0.4em);
    }
    42%, 84% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-0.04em);
    }
}

@keyframes revealBracketRight {
    0%, 16% {
        transform: translateX(-0.4em);
    }
    42%, 84% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(0.04em);
    }
}

@keyframes revealWord {
    0%, 18% {
        opacity: 0;
        transform: scale(0.82);
        filter: blur(10px);
    }
    34%, 84% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
    100% {
        opacity: 0;
        transform: scale(1.02);
        filter: blur(6px);
    }
}

@keyframes revealTilde {
    0%, 16% {
        opacity: 0;
        transform: scale(0.6);
    }
    42%, 84% {
        opacity: 1;
        transform: scale(1);
    }
    100% {
        opacity: 0;
        transform: scale(1.02);
    }
}

@media (prefers-reduced-motion: reduce) {
    .intro-wordmark,
    .intro-bracket,
    .intro-word,
    .intro-tilde {
        animation: none !important;
        transition: none !important;
    }

    body.intro-active #toolbar,
    body.intro-active .instruction {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    body.intro-active #code-panel,
    body.intro-active #openMenu {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
}

body:not(.ui-ready) #code-panel {
    transition: none !important;
}

#openMenu {
    position: absolute;
    top: 55px;
    left: 10px;
    background: #252526;
    border: 1px solid #333;

    min-width: 220px;

#openMenu.is-open {

    visibility: visible;
    opacity: 1;
    pointer-events: auto;
}

#code-panel,
#devlog-panel,
#novelo-panel {
    max-width: 100vw;
}

@media (max-width: 768px) {
    #toolbar {
        right: 10px;
        gap: 6px;
        padding: 8px;
        align-items: stretch;
    }

    #toolbar button {

    #toolbar .icon-only {

    }

    #toolbar .separator {
        display: none;
    }

    #openMenu {
        top: auto !important;

        right: 10px !important;

    }

    #code-panel,
    #devlog-panel,
    #novelo-panel {
        width: 100vw !important;
        max-width: 100vw !important;
    }

    .instruction {
        font-size: 11px;
        bottom: 12px;
    }
}

    <script>
        const NodoSound = (() => {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                return {
                    playClick() {},
                    playButton() {},
                    playIntro() {},
                    unlock() {}
                };
            }

            let audioContext = null;
            let introPlayed = false;
            let introPending = false;

            const masterVolume = 0.22;

            function getContext() {
                if (!audioContext) {
                    audioContext = new AudioContextClass();
                }
                return audioContext;
            }

            function createTone({ frequency, startTime, duration, type = 'sine', gain = 0.12, attack = 0.012, release = 0.12 }) {
                const context = getContext();
                const oscillator = context.createOscillator();
                const volume = context.createGain();
                const filter = context.createBiquadFilter();
                const endTime = startTime + duration;

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, startTime);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1800, startTime);
                filter.Q.setValueAtTime(0.7, startTime);

                volume.gain.setValueAtTime(0.0001, startTime);
                volume.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain * masterVolume), startTime + attack);
                volume.gain.exponentialRampToValueAtTime(0.0001, Math.max(startTime + attack + 0.01, endTime - release));
                volume.gain.exponentialRampToValueAtTime(0.0001, endTime);

                oscillator.connect(filter);
                filter.connect(volume);
                volume.connect(context.destination);

                oscillator.start(startTime);
                oscillator.stop(endTime + 0.04);
            }

            function playPattern(pattern) {
                const context = getContext();
                const play = () => {
                    const now = context.currentTime + 0.012;
                    pattern.forEach(note => createTone({ ...note, startTime: now + (note.delay || 0) }));
                };

                if (context.state === 'suspended') {
                    context.resume().then(play).catch(() => {});
                    return;
                }

                play();
            }

            function playClick() {
                playPattern([
                    { frequency: 720, duration: 0.07, type: 'triangle', gain: 0.07, attack: 0.006, release: 0.05 }
                ]);
            }

            function playButton() {
                playPattern([
                    { frequency: 520, duration: 0.08, type: 'sine', gain: 0.08, attack: 0.008, release: 0.06 },
                    { frequency: 780, delay: 0.035, duration: 0.09, type: 'triangle', gain: 0.055, attack: 0.008, release: 0.07 }
                ]);
            }

            function playIntro() {
                if (introPlayed) return;
                const context = getContext();
                introPending = context.state === 'suspended';

                const play = () => {
                    if (introPlayed) return;
                    introPending = false;
                    introPlayed = true;
                    playPattern([
                        { frequency: 392.0, duration: 0.48, type: 'sine', gain: 0.13, attack: 0.025, release: 0.2 },
                        { frequency: 587.33, delay: 0.46, duration: 0.62, type: 'sine', gain: 0.12, attack: 0.025, release: 0.26 },
                        { frequency: 196.0, delay: 0, duration: 0.92, type: 'triangle', gain: 0.035, attack: 0.04, release: 0.42 }
                    ]);
                };

                if (context.state === 'suspended') {
                    context.resume().then(play).catch(() => {});
                    return;
                }

                play();
            }

            function unlock() {
                const context = getContext();
                const afterUnlock = () => {
                    if (introPending && !introPlayed) {
                        playIntro();
                    }
                };

                if (context.state === 'suspended') {
                    context.resume().then(afterUnlock).catch(() => {});
                    return;
                }

                afterUnlock();
            }

            ['pointerdown', 'keydown', 'touchstart'].forEach(eventName => {
                window.addEventListener(eventName, unlock, { capture: true, passive: true });
            });

            document.addEventListener('click', event => {
                const button = event.target?.closest?.('button');
                if (!button || button.disabled) return;
                playButton();
            }, true);

            return { playClick, playButton, playIntro, unlock };
        })();
    </script>

    <script>
        (() => {
            const introOverlay = document.getElementById('intro-overlay');
            const introWordmark = introOverlay?.querySelector('.intro-wordmark');
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let introFinished = false;

            if (!introOverlay || !introWordmark) return;

            const finishIntro = () => {
                if (introFinished) return;
                introFinished = true;
                document.body.classList.remove('intro-active');
                introOverlay.remove();
            };

            if (prefersReducedMotion) {
                NodoSound.playIntro();
                finishIntro();
                return;
            }

            NodoSound.playIntro();
            document.body.classList.add('intro-active');
            introWordmark.addEventListener('animationend', finishIntro, { once: true });
            window.setTimeout(finishIntro, 4600);
        })();
    </script>

let dragTarget = null;
let offsetX = 0;

let panStartX = 0;
let panStartY = 0;

        // Configuração do Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            invalidateGridCache();
            centerInitialCards();
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function getInitialCards() {
            return nodes.filter(node => node.isInitialCard);
        }

        function centerInitialCards(force = false) {
            const initialCards = getInitialCards();
            if (initialCards.length !== 2) return;
            if (hasCustomizedInitialLayout && !force) return;

            const gap = Math.max(180, Math.min(300, canvas.width * 0.12));
            const totalWidth = initialCards.reduce((sum, node) => sum + node.width, 0) + gap;
            const startX = Math.max(24, (canvas.width - totalWidth) / 2);
           const centerY = (canvas.height / 2) + 20;
            let currentX = startX;

            initialCards.forEach(node => {
                node.x = currentX;
                node.y = Math.max(80, centerY - (node.height / 2));
                currentX += node.width + gap;
            });
        }

        // Classe Nó (Representa um arquivo)
      class Node {
    constructor(x, y, label, type = 'js', id = null) {
        this.id = id || (Date.now() + Math.random());
        this.x = x;
        this.y = y;
        this.width = 160;
        this.height = 95;

        this.label = label;
        this.type = type;
        this.description = '';
        this.color = '#3c3c3c';
        this.orderIndex = null;

        this.code = `// Código para ${label}\n`;
    }

            getOrderBadgeText() {
                if (this.orderIndex === null || this.orderIndex === undefined || this.orderIndex === '') {
                    return '';
                }

                return String(this.orderIndex);
            }

            getOrderBadgeRect(ctx) {
                const text = this.getOrderBadgeText();
                const badgeHeight = ORDER_BADGE_STYLE.diameter;
                const minWidth = ORDER_BADGE_STYLE.diameter;
                const textWidth = text ? ctx.measureText(text).width : 0;
                const badgeWidth = Math.max(minWidth, textWidth + ORDER_BADGE_STYLE.horizontalPadding * 2);
                const centerX = this.x + this.width;
                const centerY = this.y;

                return {
                    x: centerX - badgeWidth / 2,
                    y: centerY - badgeHeight / 2,
                    width: badgeWidth,
                    height: badgeHeight,
                    radius: badgeHeight / 2,
                    centerX,
                    centerY
                };
            }

            isPointInsideOrderBadge(x, y) {
                ctx.save();
                ctx.font = ORDER_BADGE_STYLE.font;
                const badge = this.getOrderBadgeRect(ctx);
                ctx.restore();

                const radius = badge.height / 2;
                const centerY = badge.y + radius;
                const leftCircleCenterX = badge.x + radius;
                const rightCircleCenterX = badge.x + badge.width - radius;

                if (x >= leftCircleCenterX && x <= rightCircleCenterX && y >= badge.y && y <= badge.y + badge.height) {
                    return true;
                }

                const leftDistance = Math.hypot(x - leftCircleCenterX, y - centerY);
                const rightDistance = Math.hypot(x - rightCircleCenterX, y - centerY);

                return leftDistance <= radius || rightDistance <= radius;
            }

            drawOrderBadge(ctx) {
                const badge = this.getOrderBadgeRect(ctx);
                const text = this.getOrderBadgeText();

                const gradient = ctx.createLinearGradient(0, badge.y, 0, badge.y + badge.height);
                gradient.addColorStop(0, ORDER_BADGE_STYLE.fillTop);
                gradient.addColorStop(1, ORDER_BADGE_STYLE.fillBottom);
                ctx.fillStyle = gradient;
                drawRoundedRect(ctx, badge.x, badge.y, badge.width, badge.height, badge.radius);
                ctx.fill();
                ctx.strokeStyle = ORDER_BADGE_STYLE.border;
                ctx.lineWidth = 1;
                ctx.stroke();

                if (!text) return;

                ctx.fillStyle = ORDER_BADGE_STYLE.text;
                ctx.font = ORDER_BADGE_STYLE.font;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, badge.x + badge.width / 2, badge.y + badge.height / 2 + 0.5);
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }


            draw(ctx, isSelected) {
                // Sombra para profundidade. Durante arrasto/pan, o blur é desativado
                // porque recalcular sombras em todos os frames causa travamentos no canvas.
                const shouldDrawShadow = !isLiveMoving;
                ctx.shadowColor = shouldDrawShadow ? 'rgba(0,0,0,0.42)' : 'transparent';
                ctx.shadowBlur = shouldDrawShadow ? (isSelected ? 10 : 7) : 0;

                // Fundo do Nó
                ctx.fillStyle = isSelected ? '#094771' : this.color; // Azul mais escuro quando selecionado
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Borda
                ctx.strokeStyle = isSelected ? '#007acc' : '#555'; // Borda azul VSCode quando selecionado
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.strokeRect(this.x, this.y, this.width, this.height);

                ctx.shadowBlur = 0; // Reset sombra
                ctx.shadowColor = 'transparent';

                // Cabeçalho (Barra superior do nó)
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(this.x, this.y, this.width, 25);

                // Texto do Título
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px Segoe UI';
                ctx.fillText(`${this.label}.${this.type}`, this.x + 10, this.y + 17);
                this.drawOrderBadge(ctx);



                // Indicador de conteúdo
                ctx.fillStyle = '#888';
                ctx.fillStyle = '#aaa';
ctx.font = '11px Segoe UI';

ctx.fillStyle = '#aaa';
ctx.font = '11px Segoe UI';

const desc = this.description || 'Sem descrição';

drawMultilineText(
    ctx,
    desc,
    this.x + 10,
    this.y + 45,
    this.width - 20,
    14,
    3
);

            }

            isPointInside(x, y) {
                return x >= this.x && x <= this.x + this.width &&
                       y >= this.y && y <= this.y + this.height;
            }
        }

            // Criar objeto de dados Serializável

        function importProject(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;


            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    loadProjectData(data);
                    alert("Projeto carregado com sucesso!");

                } catch (err) {
                    alert("Erro ao carregar arquivo: Formato inválido.");
                    console.error(err);
                }
                // Limpar o input para permitir carregar o mesmo arquivo novamente se necessário
                inputElement.value = '';
            };
            reader.readAsText(file);
        }


        function loadProjectData(data) {
  hasCustomizedInitialLayout = true;
  nodes.length = 0;
  connections.length = 0;
  selectedNodes.length = 0;

  // Restaurar nodes
  data.nodes.forEach(n => {
    const node = new Node(n.x, n.y, n.label, n.type, n.id);
    node.description = n.description || "";
    node.code = n.code || "";
    node.orderIndex = n.orderIndex ?? null;

    // Propriedades de Novelo
    if (n.isNovelo) {
        node.isNovelo = true;
        node.noveloId = n.noveloId;
    }

    nodes.push(node);
  });

  // Restaurar conexões
  data.connections.forEach(c => {
    const from = nodes.find(n => n.id === c.from);
    const to = nodes.find(n => n.id === c.to);
    if (from && to) connections.push({ from, to });
  });

  // Restaurar DevLogs
  if (data.devLogs) {
    devLogs = data.devLogs;
  } else {
    devLogs = [];
  }

  // Restaurar Novelos
  if (data.novelos) {
    novelos = data.novelos;
  } else {
    novelos = [];
  }

  // Atualizar UI de novelos se disponível
  if (window.renderNovelos) window.renderNovelos();
  // Atualizar UI de logs se disponível
  if (window.renderDevLogs) window.renderDevLogs();

  draw();
}

        function isMobileLinkModeAvailable() {
            return window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 768;
        }

        function connectNodes() {
            if (selectedNodes.length === 2) {
                const exists = connections.some(c =>
                    (c.from === selectedNodes[0] && c.to === selectedNodes[1]) ||
                    (c.from === selectedNodes[1] && c.to === selectedNodes[0])
                );

                if (!exists) {
                    connections.push({ from: selectedNodes[0], to: selectedNodes[1] });
                    triggerConnectionGridEffects(selectedNodes[0], selectedNodes[1]);
                }
                pendingMobileLinkAction = null;
                clearSelection();
                draw();
            } else if (isMobileLinkModeAvailable()) {
                pendingMobileLinkAction = 'connect';
                alert("Toque em dois cartões ao mesmo tempo para fazer a ligação do nó");

                alert("Selecione cartões usando SHIFT ou use o botão direito para fazer a ligação do nó.");
            }
        }


        function unlinkSelectedNodes() {
    if (selectedNodes.length === 2) {
        connections = connections.filter(c =>
            !(
                (c.from === selectedNodes[0] && c.to === selectedNodes[1]) ||
                (c.from === selectedNodes[1] && c.to === selectedNodes[0])
            )
        );
        pendingMobileLinkAction = null;
        clearSelection();
        draw();
    } else if (isMobileLinkModeAvailable()) {
        pendingMobileLinkAction = 'unlink';
        alert("Toque em dois cartões ao mesmo tempo para desligar o nó");
    } else {
        alert("Selecione cartões usando SHIFT ou use o botão direito para desligar o nó");
    }
}


function triggerConnectionGridEffects(a, b) {
  if (typeof window.playGridReleaseEffect !== 'function') return;

  const nodesPair = [a, b].filter(Boolean);
  nodesPair.forEach(node => {
    const centerX = node.x + node.width / 2;
    const centerY = node.y + node.height / 2;
    window.playGridReleaseEffect(centerX, centerY, node);
  });
}

function hasConnection(a, b) {
  return connections.some(c =>
    (c.from === a && c.to === b) ||
    (c.from === b && c.to === a)
  );
}

function toggleConnection(a, b) {
  if (hasConnection(a, b)) {
    // ===== DESLIGAR =====
    connections = connections.filter(c =>
      !(
        (c.from === a && c.to === b) ||
        (c.from === b && c.to === a)
      )
    );

    // feedback visual e sonoro de remoção
    playLinkEffect(a, b, "unlink");

  } else {
    // ===== LIGAR =====
    connections.push({ from: a, to: b });

    // feedback visual e sonoro de criação
    playLinkEffect(a, b, "link");
    triggerConnectionGridEffects(a, b);
  }

  NodoSound.playButton();
}


        function clearSelection() {
            selectedNodes = [];
            closePanel(); // Fecha o painel de edição também, para dar feedback visual claro
            draw();
        }


        function deleteSelectedNodes() {
  if (selectedNodes.length === 0) return;

  // Remove conexões ligadas aos nós selecionados
  connections = connections.filter(c =>
    !selectedNodes.includes(c.from) &&
    !selectedNodes.includes(c.to)
  );

  // Remove os nós
  nodes = nodes.filter(n => !selectedNodes.includes(n));

  // Limpa seleção e painel
  selectedNodes = [];
  closePanel();

  draw();
}


function drawMultilineText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
    const words = text.split(' ');
    let line = '';
    let lines = [];

    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);

        if (metrics.width > maxWidth && n > 0) {
            lines.push(line);
            line = words[n] + ' ';
        } else {
            line = testLine;
        }
    }
    lines.push(line);

    if (lines.length > maxLines) {
        lines = lines.slice(0, maxLines);
        lines[maxLines - 1] = lines[maxLines - 1].trim() + '…';
    }

    lines.forEach((l, i) => {
        ctx.fillText(l, x, y + i * lineHeight);
    });
}

        function drawRoundedRect(ctx, x, y, width, height, radius) {
    const safeRadius = Math.min(radius, width / 2, height / 2);

    ctx.beginPath();
    ctx.moveTo(x + safeRadius, y);
    ctx.lineTo(x + width - safeRadius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
    ctx.lineTo(x + width, y + height - safeRadius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
    ctx.lineTo(x + safeRadius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
    ctx.lineTo(x, y + safeRadius);
    ctx.quadraticCurveTo(x, y, x + safeRadius, y);
    ctx.closePath();
}

        function syncOrderIndexEditorPosition() {
    if (!activeOrderIndexEditor) return;

    const { input, node } = activeOrderIndexEditor;

    ctx.save();
    ctx.font = ORDER_BADGE_STYLE.font;
    const badge = node.getOrderBadgeRect(ctx);
    ctx.restore();

    const valueWidth = input.value ? measureOrderBadgeTextWidth(input.value) : 0;
    const editorWidth = Math.max(ORDER_BADGE_STYLE.diameter + 8, valueWidth + ORDER_BADGE_STYLE.horizontalPadding * 2 + 10);
    const canvasRect = canvas.getBoundingClientRect();

    input.style.left = `${canvasRect.left + badge.centerX - editorWidth / 2}px`;
    input.style.top = `${canvasRect.top + badge.centerY - badge.height / 2}px`;
    input.style.width = `${editorWidth}px`;
    input.style.height = `${badge.height}px`;
    input.style.borderRadius = `${badge.radius}px`;
}

        function measureOrderBadgeTextWidth(text) {
    ctx.save();
    ctx.font = ORDER_BADGE_STYLE.font;
    const width = ctx.measureText(text).width;
    ctx.restore();
    return width;
}

        function sanitizeOrderIndexValue(value) {
    return value.replace(/\D/g, '');
}

        function syncNoveloOrderIndex(node) {
    if (!node?.isNovelo || !node.noveloId) return;

    const noveloCollection = window.novelos || novelos;
    const novelo = noveloCollection.find(item => item.id === node.noveloId);
    if (novelo) {
        novelo.orderIndex = node.orderIndex ?? null;
    }

    nodes.forEach(currentNode => {
        if (currentNode.isNovelo && currentNode.noveloId === node.noveloId) {
            currentNode.orderIndex = node.orderIndex ?? null;
        }
    });
}

        function serializeNovelos() {
    return (window.novelos || novelos).map(n => ({
        ...n,
        orderIndex: n.orderIndex ?? null,
        nodes: (n.nodes || []).map(node => ({ ...node })),
        connections: (n.connections || []).map(connection => ({ ...connection }))
    }));
}

        function removeOrderIndexEditor(saveValue = false) {
    if (!activeOrderIndexEditor) return;

    const { input, node } = activeOrderIndexEditor;

    if (saveValue) {
        const sanitized = sanitizeOrderIndexValue(input.value);
        node.orderIndex = sanitized === '' ? null : sanitized;
        syncNoveloOrderIndex(node);
        draw();
    }

    input.remove();
    activeOrderIndexEditor = null;
}

        function openOrderIndexEditor(node) {
    removeOrderIndexEditor(false);

    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.value = node.orderIndex ?? '';
    input.style.position = 'absolute';
    input.style.padding = '0 10px';
    input.style.borderRadius = `${ORDER_BADGE_STYLE.diameter / 2}px`;
    input.style.border = `1px solid ${ORDER_BADGE_STYLE.border}`;
    input.style.background = `linear-gradient(180deg, ${ORDER_BADGE_STYLE.fillTop} 0%, ${ORDER_BADGE_STYLE.fillBottom} 100%)`;
    input.style.color = ORDER_BADGE_STYLE.text;
    input.style.font = ORDER_BADGE_STYLE.font;
    input.style.textAlign = 'center';
    input.style.zIndex = '1000';
    input.style.outline = 'none';
    input.style.boxSizing = 'border-box';
    input.style.boxShadow = '0 6px 18px rgba(0,0,0,0.3)';

    input.addEventListener('input', () => {
        const sanitized = sanitizeOrderIndexValue(input.value);
        if (input.value !== sanitized) {
            input.value = sanitized;
        }

        syncOrderIndexEditorPosition();
    });

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            input.blur();
        } else if (event.key === 'Escape') {
            event.preventDefault();
            removeOrderIndexEditor(false);
            draw();
        }
    });

    input.addEventListener('blur', () => removeOrderIndexEditor(true), { once: true });

    document.body.appendChild(input);
    activeOrderIndexEditor = { input, node };
    syncOrderIndexEditorPosition();
    input.focus();
    input.select();
}


        // --- RENDERIZAÇÃO ---

        const GRID_SIZE = 40;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            if (typeof window.drawGridReleaseEffects === 'function') {
                window.drawGridReleaseEffects(ctx, GRID_SIZE);
            }

            // Desenhar Conexões
            ctx.strokeStyle = CONNECTION_LINE_COLOR;
            ctx.lineWidth = 2;
            connections.forEach(conn => {
                const startX = conn.from.x + conn.from.width / 2;
                const startY = conn.from.y + conn.from.height / 2;
                const endX = conn.to.x + conn.to.width / 2;
                const endY = conn.to.y + conn.to.height / 2;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                // Curva suave
                const cp1x = startX + (endX - startX) / 2;
                const cp1y = startY;
                const cp2x = startX + (endX - startX) / 2;
                const cp2y = endY;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
                ctx.stroke();
            });

            // Desenhar Nós
            nodes.forEach(node => {
                const isSelected = selectedNodes.includes(node);
                node.draw(ctx, isSelected);
            });

            syncOrderIndexEditorPosition();
        }

        function drawGrid() {
            if (!cachedGridCanvas || cachedGridWidth !== canvas.width || cachedGridHeight !== canvas.height) {
                cachedGridCanvas = document.createElement('canvas');
                cachedGridCanvas.width = canvas.width;
                cachedGridCanvas.height = canvas.height;
                cachedGridWidth = canvas.width;
                cachedGridHeight = canvas.height;

                const gridCtx = cachedGridCanvas.getContext('2d');
                gridCtx.strokeStyle = '#2e2e2e';
                gridCtx.lineWidth = 1;
                gridCtx.beginPath();
                for (let x = 0; x < cachedGridCanvas.width; x += GRID_SIZE) {
                    gridCtx.moveTo(x, 0);
                    gridCtx.lineTo(x, cachedGridCanvas.height);
                }
                for (let y = 0; y < cachedGridCanvas.height; y += GRID_SIZE) {
                    gridCtx.moveTo(0, y);
                    gridCtx.lineTo(cachedGridCanvas.width, y);
                }
                gridCtx.stroke();
            }

            ctx.drawImage(cachedGridCanvas, 0, 0);
        }

        // --- INTERAÇÃO (MOUSE / TOUCH) ---

       let pointerDownPos = null;
       let pointerMoved = false;
       let activePointerType = null;

       function isTouchLikeEvent(e) {
    return e.type.startsWith('touch');
}

       function getPointerSource(e) {
    if (e.touches && e.touches.length > 0) return e.touches[0];
    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0];
    return e;
}

       function isBodyRotated() {
    return Boolean(window.isRotated);
}

       function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
}

       function clampNodePosition(node, nextX, nextY) {
    return {
        x: clamp(nextX, 0, Math.max(0, canvas.width - node.width)),
        y: clamp(nextY, 0, Math.max(0, canvas.height - node.height))
    };
}

       function clampNodesDelta(targetNodes, deltaX, deltaY) {
    let minDeltaX = -Infinity;
    let maxDeltaX = Infinity;
    let minDeltaY = -Infinity;
    let maxDeltaY = Infinity;

    targetNodes.forEach(node => {
        minDeltaX = Math.max(minDeltaX, -node.x);
        maxDeltaX = Math.min(maxDeltaX, canvas.width - node.width - node.x);
        minDeltaY = Math.max(minDeltaY, -node.y);
        maxDeltaY = Math.min(maxDeltaY, canvas.height - node.height - node.y);
    });

    return {
        deltaX: clamp(deltaX, minDeltaX, maxDeltaX),
        deltaY: clamp(deltaY, minDeltaY, maxDeltaY)
    };
}

       function getCanvasPointerRect() {
    const rect = canvas.getBoundingClientRect();

    if (!isBodyRotated()) {
        return rect;
    }

    return {
        ...rect,
        width: rect.height,
        height: rect.width
    };
}

       function getPointerPos(e) {
    const pointer = getPointerSource(e);
    const rect = getCanvasPointerRect();

    if (isBodyRotated()) {
        return {
            x: pointer.clientY - rect.top,
            y: rect.width - (pointer.clientX - rect.left)
        };
    }

    return {
        x: pointer.clientX - rect.left,
        y: pointer.clientY - rect.top
    };
}

       let pointerDownContext = null;

       function findTopNodeAt(pointerX, pointerY) {
    return [...nodes].reverse().find(node => node.isPointInside(pointerX, pointerY)) || null;
}

       function updateNodeSelection(targetNode, isMultiSelect) {
    if (!targetNode) return;

    if (isMultiSelect) {
        if (selectedNodes.includes(targetNode)) {
            selectedNodes = selectedNodes.filter(node => node !== targetNode);
        } else {
            selectedNodes = [...selectedNodes, targetNode];
        }
        return;
    }

    if (!selectedNodes.includes(targetNode) || selectedNodes.length !== 1) {
        selectedNodes = [targetNode];
    }
}

       function handleCanvasTap(pointerX, pointerY, options = {}) {
    NodoSound.playClick();
    const { shiftKey = false, preserveSelection = false, openPanelForNode = false } = options;
    const isInsideActiveNovelo = window.isNoveloActive && window.isNoveloActive();
    const badgeTarget = [...nodes].reverse().find(node => node.isPointInsideOrderBadge(pointerX, pointerY));

    if (badgeTarget) {
        removeEnterNoveloButton();
        openOrderIndexEditor(badgeTarget);
        draw();
        return;
    }

    const target = findTopNodeAt(pointerX, pointerY);
    if (!target) {
        removeOrderIndexEditor(false);
        removeEnterNoveloButton();
        if (!shiftKey && !preserveSelection && !pendingMobileLinkAction) {
            clearSelection();
            return;
        }
        draw();
        return;
    }

    if (!preserveSelection) {
        const shouldMultiSelect = shiftKey || Boolean(pendingMobileLinkAction);
        updateNodeSelection(target, shouldMultiSelect);

        if (pendingMobileLinkAction === 'connect' && selectedNodes.length === 2) {
            connectNodes();
            return;
        }

        if (pendingMobileLinkAction === 'unlink' && selectedNodes.length === 2) {
            unlinkSelectedNodes();
            return;
        }
    }

    if (target.isNovelo) {
        removeOrderIndexEditor(false);
        if (!isInsideActiveNovelo) {
            showEnterNoveloButton(target.noveloId);
        }
        draw();
        return;
    }

    removeOrderIndexEditor(false);
    removeEnterNoveloButton();
    if (openPanelForNode) {
        openCodePanel(target);
    }
    draw();
}

       function handlePointerDown(e) {
    const { x: pointerX, y: pointerY } = getPointerPos(e);
    const isTouchEvent = isTouchLikeEvent(e);
    const button = isTouchEvent ? 0 : e.button;

    if (isTouchEvent) {
        e.preventDefault();
    }

    activePointerType = isTouchEvent ? 'touch' : 'mouse';
    pointerDownPos = { x: pointerX, y: pointerY };
    pointerMoved = false;
    pointerDownContext = null;
    isDragging = false;
    isPanning = false;
    isLiveMoving = false;
    dragTarget = null;
    offsetX = 0;
    offsetY = 0;

    const badgeTarget = [...nodes].reverse().find(node => node.isPointInsideOrderBadge(pointerX, pointerY));
    if (badgeTarget && button === 0) {
        pointerDownContext = { type: 'badge', node: badgeTarget, shiftKey: !!e.shiftKey, button };
        removeEnterNoveloButton();
        return;
    }

    const target = findTopNodeAt(pointerX, pointerY);

if (button === 2) {
  if (!target || selectedNodes.length !== 1) {
    pointerDownPos = null;
    activePointerType = null;
    return;
  }

  const baseNode = selectedNodes[0];
  if (baseNode === target) {
    pointerDownPos = null;
    activePointerType = null;
    return;
  }

  toggleConnection(baseNode, target);
  draw();
  pointerDownPos = null;
  activePointerType = null;
  return;
}

    if (button !== 0) {
        pointerDownPos = null;
        activePointerType = null;
        return;
    }

    pointerDownContext = {
        type: target ? 'node' : 'canvas',
        node: target,
        shiftKey: !!e.shiftKey,
        button
    };

    if (target) {
        dragTarget = target;
        offsetX = pointerX - dragTarget.x;
        offsetY = pointerY - dragTarget.y;
        updateNodeSelection(dragTarget, !!e.shiftKey);
        isDragging = selectedNodes.includes(dragTarget);

        if (!e.shiftKey && activeNode && activeNode !== dragTarget) {
            openCodePanel(dragTarget);
        }

        const index = nodes.indexOf(dragTarget);
        if (index > -1) {
            nodes.splice(index, 1);
            nodes.push(dragTarget);
        }

        draw();
        return;
    }

    isPanning = true;
    panStartX = pointerX;
    panStartY = pointerY;
}

       function handlePointerMove(e) {
    const { x: pointerX, y: pointerY } = getPointerPos(e);

    if (isTouchLikeEvent(e)) {
        e.preventDefault();
    }

    if (pointerDownPos) {
        const movedX = Math.abs(pointerX - pointerDownPos.x);
        const movedY = Math.abs(pointerY - pointerDownPos.y);
        if (movedX > 4 || movedY > 4) {
            pointerMoved = true;
        }
    }

    if (isPanning) {
        const dx = pointerX - panStartX;
        const dy = pointerY - panStartY;

        if (dx !== 0 || dy !== 0) {
            hasCustomizedInitialLayout = true;
        }

        nodes.forEach(node => {
            node.x += dx;
            node.y += dy;
        });

        panStartX = pointerX;
        panStartY = pointerY;

        isLiveMoving = true;
        requestDraw();
        return;
    }

    if (isDragging && dragTarget) {
        if (selectedNodes.includes(dragTarget) && selectedNodes.length > 1) {
            const proposedDeltaX = pointerX - (dragTarget.x + offsetX);
            const proposedDeltaY = pointerY - (dragTarget.y + offsetY);
            const { deltaX, deltaY } = clampNodesDelta(selectedNodes, proposedDeltaX, proposedDeltaY);

            if (deltaX !== 0 || deltaY !== 0) {
                hasCustomizedInitialLayout = true;
            }

            selectedNodes.forEach(node => {
                node.x += deltaX;
                node.y += deltaY;
            });

            offsetX = pointerX - dragTarget.x;
            offsetY = pointerY - dragTarget.y;
        } else {
            const clampedPosition = clampNodePosition(dragTarget, pointerX - offsetX, pointerY - offsetY);
            if (clampedPosition.x !== dragTarget.x || clampedPosition.y !== dragTarget.y) {
                hasCustomizedInitialLayout = true;
            }
            dragTarget.x = clampedPosition.x;
            dragTarget.y = clampedPosition.y;
        }

        isLiveMoving = true;
        requestDraw();
    }
}

       function handlePointerUp(e) {
    const isTouchEvent = isTouchLikeEvent(e);

    if (isTouchEvent) {
        e.preventDefault();
    }

    const { x: pointerX, y: pointerY } = getPointerPos(e);
    const expectedPointerType = isTouchEvent ? 'touch' : 'mouse';
    const shouldHandleTap = Boolean(pointerDownPos) && !pointerMoved && activePointerType === expectedPointerType;
    const currentPointerContext = pointerDownContext;
    const releasedDragTarget = isDragging && dragTarget ? dragTarget : null;
    const shouldPlayGridReleaseEffect = Boolean(
        releasedDragTarget &&
        pointerMoved &&
        activePointerType === expectedPointerType &&
        e.type !== 'touchcancel'
    );

    isDragging = false;
    isPanning = false;
    isLiveMoving = false;
    dragTarget = null;
    offsetX = 0;
    offsetY = 0;
    activePointerType = null;
    pointerDownPos = null;
    pointerMoved = false;
    pointerDownContext = null;

    if (shouldPlayGridReleaseEffect && typeof window.playGridReleaseEffect === 'function') {
        window.playGridReleaseEffect(pointerX, pointerY, releasedDragTarget);
    }

    if (!shouldHandleTap || e.type === 'touchcancel') {
        requestDraw();
        return;
    }

    if (currentPointerContext?.type === 'badge') {
        handleCanvasTap(pointerX, pointerY, { shiftKey: currentPointerContext.shiftKey, preserveSelection: true });
        return;
    }

    if (currentPointerContext?.type === 'node') {
        handleCanvasTap(pointerX, pointerY, {
            shiftKey: currentPointerContext.shiftKey,
            preserveSelection: true,
            openPanelForNode: isTouchEvent && !currentPointerContext.shiftKey
        });
        return;
    }

    handleCanvasTap(pointerX, pointerY, { shiftKey: currentPointerContext?.shiftKey });
}

<script>
/* =================================================
   FEEDBACK VISUAL
================================================= */

(function () {

  const effects = [];
  const gridReleaseEffects = [];
  const GRID_RELEASE_DURATION = 1400;
  const GRID_RELEASE_GRID_SIZE = 40;
  const GRID_RELEASE_MAX_ACTIVE = 4;
  const GRID_RELEASE_WALKERS = 5;
  const GRID_RELEASE_STEPS = 9;
  const GRID_RELEASE_TRAIL_SEGMENTS = 4;
  const GRID_RELEASE_COLOR = {
    r: 242,
    g: 184,
    b: 75
  };
  let gridReleaseFramePending = false;

  function clamp01(value) {
    return Math.min(Math.max(value, 0), 1);
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function colorWithAlpha(alpha) {
    return `rgba(${GRID_RELEASE_COLOR.r}, ${GRID_RELEASE_COLOR.g}, ${GRID_RELEASE_COLOR.b}, ${alpha})`;
  }

  function roundToGrid(value, gridSize) {
    return Math.round(value / gridSize) * gridSize;
  }

  function createSeededRandom(seed) {
    let state = Math.floor(seed * 2147483647) || 1;
    return function () {
      state = (state * 48271) % 2147483647;
      return state / 2147483647;
    };
  }

  function drawGlowingLine(ctx, x1, y1, x2, y2, alpha, width = 2) {
    if (alpha <= 0) return;

    // Evita shadowBlur no canvas: ele é caro em animações e causava engasgos.
    // O brilho é simulado com uma passada larga translúcida + uma linha central.
    ctx.lineCap = 'round';
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    ctx.strokeStyle = colorWithAlpha(alpha * 0.24);
    ctx.lineWidth = width + 6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.strokeStyle = colorWithAlpha(alpha);
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawGridOrb(ctx, x, y, radius, alpha) {
    if (alpha <= 0) return;

    // Mesmo princípio das linhas: brilho barato sem filtro de blur.
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = colorWithAlpha(alpha * 0.22);
    ctx.beginPath();
    ctx.arc(x, y, radius * 2.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = colorWithAlpha(alpha * 0.42);
    ctx.beginPath();
    ctx.arc(x, y, radius * 1.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = colorWithAlpha(alpha);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function scheduleGridReleaseFrame() {
    if (gridReleaseFramePending) return;
    gridReleaseFramePending = true;
    requestAnimationFrame(() => {
      gridReleaseFramePending = false;
      draw();
    });
  }

  function createGridWalkers(x, y, gridSize, seed) {
    const random = createSeededRandom(seed);
    const start = {
      x: roundToGrid(x, gridSize),
      y: roundToGrid(y, gridSize)
    };
    const directions = [
      { x: 1, y: 0 },
      { x: -1, y: 0 },
      { x: 0, y: 1 },
      { x: 0, y: -1 }
    ];
    const maxX = Math.ceil(canvas.width / gridSize) * gridSize;
    const maxY = Math.ceil(canvas.height / gridSize) * gridSize;

    return Array.from({ length: GRID_RELEASE_WALKERS }, (_, walkerIndex) => {
      const path = [{ ...start }];
      let lastDirection = directions[Math.floor(random() * directions.length)];

      for (let step = 0; step < GRID_RELEASE_STEPS; step++) {
        const current = path[path.length - 1];
        let options = directions.filter(direction => {
          const nextX = current.x + direction.x * gridSize;
          const nextY = current.y + direction.y * gridSize;
          const isReverse = direction.x === -lastDirection.x && direction.y === -lastDirection.y;
          return !isReverse && nextX >= 0 && nextX <= maxX && nextY >= 0 && nextY <= maxY;
        });

        if (!options.length) options = directions;
        const direction = options[Math.floor(random() * options.length)];
        lastDirection = direction;
        path.push({
          x: Math.min(Math.max(current.x + direction.x * gridSize, 0), maxX),
          y: Math.min(Math.max(current.y + direction.y * gridSize, 0), maxY)
        });
      }

      return {
        path,
        delay: walkerIndex * 0.045 + random() * 0.08,
        speed: 0.82 + random() * 0.28,
        radius: 3.8 + random() * 2.2
      };
    });
  }

  function drawGridWalker(ctx, walker, progress, fade) {
    const localProgress = clamp01((progress - walker.delay) * walker.speed);
    if (localProgress <= 0) return;

    const path = walker.path;
    const pathPosition = localProgress * (path.length - 1);
    const currentIndex = Math.min(Math.floor(pathPosition), path.length - 2);
    const segmentProgress = pathPosition - currentIndex;
    const from = path[currentIndex];
    const to = path[currentIndex + 1];
    const head = {
      x: from.x + (to.x - from.x) * easeOutCubic(segmentProgress),
      y: from.y + (to.y - from.y) * easeOutCubic(segmentProgress)
    };
    const startSegment = Math.max(0, currentIndex - GRID_RELEASE_TRAIL_SEGMENTS + 1);

    for (let segment = startSegment; segment < currentIndex; segment++) {
      const p1 = path[segment];
      const p2 = path[segment + 1];
      const age = currentIndex - segment;
      const alpha = fade * clamp01(1 - age / (GRID_RELEASE_TRAIL_SEGMENTS + 1)) * 0.48;
      drawGlowingLine(ctx, p1.x, p1.y, p2.x, p2.y, alpha, 2.2);
    }

    const partialAgeAlpha = fade * 0.72;
    drawGlowingLine(ctx, from.x, from.y, head.x, head.y, partialAgeAlpha, 2.8);
    drawGridOrb(ctx, head.x, head.y, walker.radius, fade * (1 - localProgress * 0.25));
  }

  window.playGridReleaseEffect = function (x, y, node = null) {
    const now = performance.now();
    const gridSize = typeof GRID_SIZE === 'number' ? GRID_SIZE : GRID_RELEASE_GRID_SIZE;
    const seed = Math.random();
    gridReleaseEffects.push({
      x,
      y,
      node,
      startTime: now,
      duration: GRID_RELEASE_DURATION,
      seed,
      walkers: createGridWalkers(x, y, gridSize, seed)
    });

    if (gridReleaseEffects.length > GRID_RELEASE_MAX_ACTIVE) {
      gridReleaseEffects.splice(0, gridReleaseEffects.length - GRID_RELEASE_MAX_ACTIVE);
    }

    scheduleGridReleaseFrame();
  };

  window.drawGridReleaseEffects = function (ctx, gridSize = 40) {
    const now = performance.now();

    for (let i = gridReleaseEffects.length - 1; i >= 0; i--) {
      const effect = gridReleaseEffects[i];
      const progress = clamp01((now - effect.startTime) / effect.duration);

      if (progress >= 1) {
        gridReleaseEffects.splice(i, 1);
        continue;
      }

      const fade = Math.pow(1 - progress, 1.6);
      const snapX = roundToGrid(effect.x, gridSize);
      const snapY = roundToGrid(effect.y, gridSize);
      const travelProgress = clamp01(progress / 0.2);
      const orbX = effect.x + (snapX - effect.x) * easeOutCubic(travelProgress);
      const orbY = effect.y + (snapY - effect.y) * easeOutCubic(travelProgress);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      drawGlowingLine(ctx, effect.x, effect.y, orbX, orbY, 0.38 * (1 - travelProgress) * fade, 2.4);
      effect.walkers.forEach(walker => drawGridWalker(ctx, walker, progress, fade));

      if (travelProgress < 1) {
        drawGridOrb(ctx, orbX, orbY, 4.5, 0.8 * fade);
      }

      ctx.restore();
    }
  };

  window.playLinkEffect = function (from, to, type = "link") {
    effects.push({ from, to, type, t: 0 });
  };

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function drawEffects(ctx) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t += 0.05;

      if (e.t >= 1) {
        effects.splice(i, 1);
        continue;
      }

      const x1 = e.from.x + e.from.width / 2;
      const y1 = e.from.y + e.from.height / 2;
      const x2 = e.to.x + e.to.width / 2;
      const y2 = e.to.y + e.to.height / 2;

      ctx.save();

      if (e.type === "link") {
        /* ===== NOVO LINK SNAP ===== */

        const t = easeOutBack(e.t);

        // Linha principal (aparece rápido)
        const linkAlpha = 1 - e.t;
        const currentX = x1 + (x2 - x1) * Math.min(t, 1);
        const currentY = y1 + (y2 - y1) * Math.min(t, 1);

        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = `rgba(242, 184, 75, ${linkAlpha * 0.18})`;
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();

        ctx.strokeStyle = `rgba(242, 184, 75, ${linkAlpha * 0.9})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();

        // Flash de fixação nos nós
        if (e.t > 0.4) {
          const pulse = (1 - e.t) * 12;

          ctx.strokeStyle = `rgba(242,184,75,${(1 - e.t) * 0.85})`;
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.arc(x1, y1, pulse, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(x2, y2, pulse, 0, Math.PI * 2);
          ctx.stroke();
        }

      } else {
        /* ===== REMOÇÃO (MANTIDA) ===== */

        const t = e.t;
        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;

        ctx.strokeStyle = `rgba(255, 80, 80, ${1 - t})`;
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 8]);

        ctx.beginPath();
        ctx.moveTo(
          x1 + (cx - x1) * t,
          y1 + (cy - y1) * t
        );
        ctx.lineTo(
          x2 + (cx - x2) * t,
          y2 + (cy - y2) * t
        );
        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle = `rgba(255,80,80,${1 - t})`;
        ctx.beginPath();
        ctx.arc(cx, cy, 10 * (1 - t), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  const originalDraw = window.draw;
  window.draw = function () {
    originalDraw();
    drawEffects(ctx);
    if (effects.length || gridReleaseEffects.length) scheduleGridReleaseFrame();
  };

})();
</script>

    if (!mainMapBackup) {
      mainMapBackup = {

    y: n.y,

    type: n.type,
    description: n.description,
    code: n.code,
    orderIndex: n.orderIndex,

    noveloId: n.noveloId || null
  })),
  connections: connections.map(c => ({
    from: c.from.id,
    to: c.to.id
  }))
};

    }

    nodes.length = 0;
    connections.length = 0;

    n.nodes.forEach(d => {
      const node = new Node(d.x, d.y, d.label, d.type, d.id);
      node.description = d.description;
      node.code = d.code;
      node.orderIndex = d.orderIndex ?? null;
      nodes.push(node);
    });

    n.connections.forEach(c => {
      const from = nodes.find(n => n.id === c.from);
      const to = nodes.find(n => n.id === c.to);
      if (from && to) connections.push({ from, to });
    });

    activeNovelo = n;
    selectedNoveloId = null;
    showExitButton();
    draw();
  };

  /* ---------- SAIR ---------- */
  function showExitButton() {
    exitBtn.onclick = exitNovelo;
    updateActionBarVisibility();
  }

  function exitNovelo() {
    activeNovelo.nodes = nodes.map(n => ({
      id: n.id,
      x: n.x,
      y: n.y,
      label: n.label,
      type: n.type,
      description: n.description,
      code: n.code,
      orderIndex: n.orderIndex
    }));

    activeNovelo.connections = connections.map(c => ({
      from: c.from.id,
      to: c.to.id
    }));

    nodes.length = 0;
    connections.length = 0;

    mainMapBackup.nodes.forEach(d => {
  const node = new Node(d.x, d.y, d.label, d.type, d.id);
  node.description = d.description;
  node.code = d.code;
  node.orderIndex = d.orderIndex ?? null;

  // 🔑 RESTAURA IDENTIDADE DE NOVELO
  if (d.isNovelo) {
    node.isNovelo = true;
    node.noveloId = d.noveloId;
  }

  nodes.push(node);
});


    mainMapBackup.connections.forEach(c => {
      const from = nodes.find(n => n.id === c.from);
      const to = nodes.find(n => n.id === c.to);
      if (from && to) connections.push({ from, to });
    });

    mainMapBackup = null;
    activeNovelo = null;
    selectedNoveloId = null;

    updateActionBarVisibility();
    draw();
  }

  /* ---------- EXCLUIR ---------- */
  window.deleteNovelo = function (id) {
    if (activeNovelo && activeNovelo.id === id) {
      alert("Feche o novelo antes de excluir.");
      return;
    }

    if (selectedNoveloId === id) {
      selectedNoveloId = null;
    }

    // Atualiza a global novelos
    if (window.novelos) {
        window.novelos = window.novelos.filter(n => n.id !== id);
        // Sincroniza referência local se necessário, embora não deva ser pois usamos a global
    }

    // Também remove nós que referenciam este novelo
    nodes = nodes.filter(n => n.noveloId !== id);

    renderNovelos();
    draw();
  };

})();
</script>




<script>
/* ===============================================
   UNDO — CTRL + Z
================================================ */

(function() {

  // ----- ESTADO GLOBAL DO UNDO -----
  const undoStack = [];
  // Variáveis para capturar estado de movimento
  let moveSnapshot = null;

  // Registra uma ação na pilha
  function registerAction(action) {
    // action = { type, description, undoFunc }
    undoStack.push(action);
    // Limita o tamanho da pilha se necessário (opcional, ex: 50 ações)
    if (undoStack.length > 50) undoStack.shift();
  }

  // Mostra janela de desfazer
  function showUndoDialog() {
    if (undoStack.length === 0) {
      alert("Nenhuma ação para desfazer.");
      return;
    }

    // Remove overlay anterior se existir
    const oldOverlay = document.getElementById("undo-overlay");
    if (oldOverlay) oldOverlay.remove();

    // Criar overlay
    const overlay = document.createElement("div");
    overlay.id = "undo-overlay";
    overlay.style.cssText = `
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
    `;

    // Criar painel
    const panel = document.createElement("div");
    panel.style.cssText = `
      background:#252526;
      padding:20px;
      border-radius:8px;
      width:400px;
      max-height:80%;
      overflow:auto;
      color:#ccc;
      font-family:'Segoe UI',sans-serif;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #444;
    `;

    const title = document.createElement("h3");
    title.innerText = "Histórico de Ações";
    title.style.marginTop = "0";
    title.style.color = "#fff";
    title.style.borderBottom = "1px solid #333";
    title.style.paddingBottom = "10px";
    panel.appendChild(title);

    const list = document.createElement("ul");
    list.style.listStyle = "none";
    list.style.padding = "0";
    list.style.margin = "10px 0";

    // Renderiza a lista (Do mais recente para o mais antigo)
    // Usamos clone da array para não afetar a original no reverse
    [...undoStack].reverse().forEach((action, idx) => {
      const li = document.createElement("li");
      li.style.padding = "8px 5px";
      li.style.borderBottom = "1px solid #333";
      li.style.fontSize = "13px";
      li.style.color = idx === 0 ? "#fff" : "#999"; // Destaque para o último
      li.innerText = `${action.type} ${action.description ? '— ' + action.description : ''}`;
      list.appendChild(li);
    });

    panel.appendChild(list);

    // Botões
    const buttonsDiv = document.createElement("div");
    buttonsDiv.style.display = "flex";
    buttonsDiv.style.justifyContent = "flex-end";
    buttonsDiv.style.gap = "10px";
    buttonsDiv.style.marginTop = "15px";

    const undoBtn = document.createElement("button");
    undoBtn.innerText = "↩ Desfazer Última";
    undoBtn.style.background = "#b42318";
    undoBtn.style.color = "#fff";
    undoBtn.style.padding = "8px 14px";
    undoBtn.style.border = "none";
    undoBtn.style.borderRadius = "4px";
    undoBtn.style.cursor = "pointer";
    undoBtn.style.fontWeight = "bold";

    undoBtn.onclick = () => {
      const action = undoStack.pop();
      if (action && typeof action.undoFunc === "function") {
        action.undoFunc();

        // Remove o item da lista visualmente
        if (list.firstChild) list.removeChild(list.firstChild);

        // Feedback visual
        draw();

        // Fecha se acabar
        if (undoStack.length === 0) {
          overlay.remove();
        }
      }
    };

    const closeBtn = document.createElement("button");
    closeBtn.innerText = "Fechar";
    closeBtn.style.background = "#3c3c3c";
    closeBtn.style.color = "#fff";
    closeBtn.style.padding = "8px 14px";
    closeBtn.style.border = "none";
    closeBtn.style.borderRadius = "4px";
    closeBtn.style.cursor = "pointer";
    closeBtn.onclick = () => {
      overlay.remove();
    };

    buttonsDiv.appendChild(undoBtn);
    buttonsDiv.appendChild(closeBtn);
    panel.appendChild(buttonsDiv);

    overlay.appendChild(panel);
    document.body.appendChild(overlay);
  }

  // ----- INTEGRAÇÃO (WRAPPERS) -----

  // 1. Adicionar Nó
  const originalAddNode = window.addNode;
  window.addNode = function(...args) {
    const initialLength = nodes.length;
    originalAddNode(...args);

    // Verifica se realmente adicionou (usuário pode ter cancelado o prompt)
    if (nodes.length > initialLength) {
      const addedNode = nodes[nodes.length - 1];
      registerAction({
        type: "Adicionar nó",
        description: addedNode.label,
        undoFunc: () => {
          // Remove o nó adicionado
          const idx = nodes.indexOf(addedNode);
          if (idx > -1) nodes.splice(idx, 1);
          draw();
        }
      });
    }
  };

  // 2. Deletar Nós (CORRIGIDO: Usa referências reais para preservar conexões)
  const originalDeleteSelectedNodes = window.deleteSelectedNodes;
  window.deleteSelectedNodes = function(...args) {
    if (selectedNodes.length === 0) return;

    // Guarda REFERÊNCIAS aos objetos originais, não cópias
    const nodesToSave = [...selectedNodes];

    // Guarda conexões que envolvem estes nós antes que sejam destruídas
    const connectionsToSave = connections.filter(c =>
      nodesToSave.includes(c.from) || nodesToSave.includes(c.to)
    );

    originalDeleteSelectedNodes(...args);

    registerAction({
      type: "Excluir nó(s)",
      description: nodesToSave.map(n => n.label).join(", "),
      undoFunc: () => {
        // Restaura os nós originais para o array global
        nodes.push(...nodesToSave);

        // Restaura as conexões (que ainda apontam para os objetos restaurados)
        connections.push(...connectionsToSave);

        draw();
      }
    });
  };

  // 3. Conectar Nós
  const originalConnectNodes = window.connectNodes;
  window.connectNodes = function(...args) {
    const countBefore = connections.length;
    originalConnectNodes(...args);

    // Se houve adição
    if (connections.length > countBefore) {
      const newConn = connections[connections.length - 1];
      registerAction({
        type: "Conectar nós",
        description: `${newConn.from.label} → ${newConn.to.label}`,
        undoFunc: () => {
          // Remove especificamente esta conexão
          const idx = connections.indexOf(newConn);
          if (idx > -1) connections.splice(idx, 1);
          draw();
        }
      });
    }
  };

  // 4. Desconectar (Unlink)
  const originalUnlinkSelectedNodes = window.unlinkSelectedNodes;
  window.unlinkSelectedNodes = function(...args) {
    // Identifica quais links serão removidos (entre os selecionados)
    const linksToRemove = connections.filter(c =>
      (selectedNodes.includes(c.from) && selectedNodes.includes(c.to)) ||
      (selectedNodes.includes(c.to) && selectedNodes.includes(c.from))
    );

    if (linksToRemove.length === 0) {
        originalUnlinkSelectedNodes(...args);
        return;
    }

    originalUnlinkSelectedNodes(...args);

    registerAction({
      type: "Desconectar nós",
      description: `${linksToRemove.length} ligação(ões)`,
      undoFunc: () => {
        connections.push(...linksToRemove);
        draw();
      }
    });
  };

  // 5. Movimento (CORRIGIDO: Snapshot no mousedown para evitar race condition)
  // O evento mousedown deste script roda APÓS o do script principal (se inserido depois),
  // portanto 'dragTarget' e 'selectedNodes' já estarão configurados pelo main.

  const captureMoveSnapshot = (e) => {
      if (e?.type?.startsWith("touch")) {
          e.preventDefault();
      }
      // Se o script principal detectou um alvo para arrastar
      if (dragTarget) {
          // Determina quais nós estão sendo movidos
          // Lógica do main: se dragTarget está na seleção (e >1), move todos. Senão, move só ele.
          if (selectedNodes.includes(dragTarget) && selectedNodes.length > 1) {
              moveSnapshot = selectedNodes.map(n => ({ node: n, startX: n.x, startY: n.y }));
          } else {
              moveSnapshot = [{ node: dragTarget, startX: dragTarget.x, startY: dragTarget.y }];
          }
      } else {
          moveSnapshot = null;
      }
  };

  const registerMoveSnapshot = (e) => {
      if (e?.type?.startsWith("touch")) {
          e.preventDefault();
      }
      if (moveSnapshot) {
          // Verifica se houve deslocamento real em algum nó
          const hasMoved = moveSnapshot.some(item =>
              item.node.x !== item.startX || item.node.y !== item.startY
          );

          if (hasMoved) {
              // Cria closure com os dados do snapshot atual
              const recordedSnapshot = [...moveSnapshot];

              registerAction({
                  type: "Mover nó(s)",
                  description: recordedSnapshot.length > 1 ? "Vários nós" : recordedSnapshot[0].node.label,
                  undoFunc: () => {
                      // Restaura posição de todos os nós envolvidos
                      recordedSnapshot.forEach(item => {
                          item.node.x = item.startX;
                          item.node.y = item.startY;
                      });
                      draw();
                  }
              });
          }
          // Limpa snapshot
          moveSnapshot = null;
      }
  };

  canvas.addEventListener("mousedown", captureMoveSnapshot);
  canvas.addEventListener("touchstart", captureMoveSnapshot, { passive: false });
  canvas.addEventListener("mouseup", registerMoveSnapshot);
  canvas.addEventListener("touchend", registerMoveSnapshot, { passive: false });
  canvas.addEventListener("touchcancel", registerMoveSnapshot, { passive: false });


  // ----- HOTKEY CTRL + Z -----
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === "z") {
      e.preventDefault();
      showUndoDialog();
    }
  });

})();
</script>







<script>
/* =========================================================
   AUTONOMOUS SAVE STATE MONITOR
   ========================================================= */
(function () {

  /* 1. LOCALIZAR O BOTÃO DE SALVAR */
  function findSaveButton() {
    const buttons = document.querySelectorAll('button, a');
    for (const el of buttons) {
      const text = (el.innerText || '').toLowerCase();
      const aria = (el.getAttribute('aria-label') || '').toLowerCase();
      if (
        el.id === 'saveBtn' ||
        text.includes('salv') ||
        text.includes('save') ||
        aria.includes('salv') ||
        aria.includes('save')
      ) {
        return el;
      }
    }
    return null;
  }

  const saveBtn = findSaveButton();
  if (!saveBtn) {
    console.warn('[SaveMonitor] Botão salvar não encontrado.');
    return;
  }

  /* 2. ESTILOS VISUAIS (Mantidos) */
  const style = document.createElement('style');
  style.innerHTML = `
    .save-layout-pending {
      background-color: #f1c40f !important; /* Amarelo: Layout */
      color: #000 !important;
    }
    .save-structure-pending {
      background-color: #2ecc71 !important; /* Verde: Estrutura/Dados */
      color: #000 !important;
    }
  `;
  document.head.appendChild(style);

  let state = null; // null | layout | structure

  function reset() {
    state = null;
    saveBtn.classList.remove('save-layout-pending', 'save-structure-pending');
  }

  function markLayout() {
    if (state === 'structure') return; // Estrutura tem prioridade
    state = 'layout';
    saveBtn.classList.add('save-layout-pending');
  }

  function markStructure() {
    state = 'structure';
    saveBtn.classList.remove('save-layout-pending');
    saveBtn.classList.add('save-structure-pending');
  }

  /* 3. INTERCEPTAÇÃO DE FUNÇÕES (Mecanismo Principal)
     Como é um app Canvas, MutationObserver não funciona bem.
     Interceptamos as funções globais que alteram o estado. */

  const actions = [
    'addNode',
    'deleteSelectedNodes',
    'connectNodes',
    'unlinkSelectedNodes',
    'toggleConnection'
  ];

  actions.forEach(fnName => {
    if (typeof window[fnName] === 'function') {
      const original = window[fnName];
      window[fnName] = function (...args) {
        const result = original.apply(this, args);
        markStructure(); // Marca como alterado
        return result;
      };
    }
  });

  /* 4. MONITORAMENTO DE INPUTS (Editor de Código/Descrição) */
  document.addEventListener('input', (e) => {
    if (['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName)) {
       // Ignora input de arquivo
       if (e.target.type === 'file') return;
       markStructure();
    }
  });

  /* 5. MONITORAMENTO DE CANVAS (Mudanças de Posição/Layout) */
  const canvas = document.getElementById('gameMap') || document.querySelector('canvas');
  if (canvas) {
    let startX = 0, startY = 0;
    const getPrimaryPointer = (e) => {
      if (e.touches && e.touches.length > 0) return e.touches[0];
      if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0];
      return e;
    };
    const captureStartPosition = (e) => {
      if (e.type.startsWith('touch')) {
        e.preventDefault();
      }
      const pointer = getPrimaryPointer(e);
      startX = pointer.clientX;
      startY = pointer.clientY;
    };
    const markCanvasLayoutChange = (e) => {
      if (e.type.startsWith('touch')) {
        e.preventDefault();
      }
      const pointer = getPrimaryPointer(e);
      const dx = Math.abs(pointer.clientX - startX);
      const dy = Math.abs(pointer.clientY - startY);
      // Se moveu mais que 5 pixels, considera alteração de layout
      if (dx > 5 || dy > 5) {
        markLayout();
      }
    };
    canvas.addEventListener('mousedown', captureStartPosition);
    canvas.addEventListener('touchstart', captureStartPosition, { passive: false });
    canvas.addEventListener('mouseup', markCanvasLayoutChange);
    canvas.addEventListener('touchend', markCanvasLayoutChange, { passive: false });
    canvas.addEventListener('touchcancel', markCanvasLayoutChange, { passive: false });
  }

  /* 6. RESETAR AO SALVAR/CARREGAR */

  // Wrapper para Salvar
  if (typeof window.exportProject === 'function') {
    const origExport = window.exportProject;
    window.exportProject = function (...args) {
      origExport.apply(this, args);
      setTimeout(reset, 200); // Reseta visualmente após ação
    };
  }

  // Wrapper para Carregar (Importar)
  if (typeof window.loadProjectData === 'function') {
    const origLoad = window.loadProjectData;
    window.loadProjectData = function (...args) {
      origLoad.apply(this, args);
      reset();
    };
  }

  // Tecla Delete/Backspace detectada globalmente
  document.addEventListener('keydown', e => {
    if (e.key === 'Delete' || e.key === 'Backspace') {
       // Pequeno delay para garantir que algo foi deletado
       setTimeout(markStructure, 50);
    }
  });

})();
</script>
